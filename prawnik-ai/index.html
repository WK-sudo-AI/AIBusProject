<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prawnik AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: biurko kancelarii — po lewej arkusz umowy z zakreśleniami, po prawej teczka z opinią i listą ryzyk */
:root{
  --ground:#E9EDF1; --sheet:#FFFFFF; --ink:#17212B; --ink-2:#4A5866; --ink-3:#7C8996;
  --rule:#D5DCE3; --accent:#1E3A7A; --accent-ink:#FFFFFF; --accent-soft:#E3E9F6;
  --crit:#B42318; --crit-bg:#FDE4E1; --high:#C2410C; --high-bg:#FFE9D9;
  --med:#9A6A00; --med-bg:#FFF2C7; --low:#4E6275; --low-bg:#E5EBF1;
  --shadow:0 1px 2px rgba(23,33,43,.06),0 8px 24px rgba(23,33,43,.06);
  --f-doc:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F141A; --sheet:#171E26; --ink:#E6EBF0; --ink-2:#AAB6C2; --ink-3:#7D8A97;
  --rule:#2A3440; --accent:#8FA9EE; --accent-ink:#0F141A; --accent-soft:#1E2A44;
  --crit:#FF8A7E; --crit-bg:#4A1B17; --high:#FFA36B; --high-bg:#47250F;
  --med:#F2C64B; --med-bg:#3F3311; --low:#A9BBCC; --low-bg:#27313C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0F141A; --sheet:#171E26; --ink:#E6EBF0; --ink-2:#AAB6C2; --ink-3:#7D8A97;
  --rule:#2A3440; --accent:#8FA9EE; --accent-ink:#0F141A; --accent-soft:#1E2A44;
  --crit:#FF8A7E; --crit-bg:#4A1B17; --high:#FFA36B; --high-bg:#47250F;
  --med:#F2C64B; --med-bg:#3F3311; --low:#A9BBCC; --low-bg:#27313C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
html,body{background:var(--ground)}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-family:var(--f-doc);font-weight:600;font-size:20px;position:relative}
.seal::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed var(--accent);opacity:.5}
.brand h1{margin:0;font-family:var(--f-doc);font-weight:600;font-size:26px;letter-spacing:-.01em;line-height:1}
.brand p{margin:3px 0 0;color:var(--ink-3);font-size:13px}
.disclaimer{font-size:12.5px;color:var(--ink-3);max-width:44ch;text-align:right}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.disclaimer{text-align:left}}

/* Arkusz umowy */
.sheet{background:var(--sheet);border-radius:6px;box-shadow:var(--shadow);border:1px solid var(--rule);min-width:0;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--rule)}
.toolbar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:transparent;padding:7px 12px;border-radius:5px;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:9px 16px}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
select.ctl,input.ctl{border:1px solid var(--rule);background:var(--sheet);border-radius:5px;padding:7px 9px;font-size:13.5px}
.opts{display:flex;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--ground) 40%,var(--sheet))}
.opts label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.opts label.grow{flex:1;min-width:180px}
.opts .ctl{text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400}

.docbox{position:relative;min-height:540px}
textarea#doc-input{display:block;width:100%;min-height:620px;border:0;resize:vertical;background:transparent;padding:28px clamp(18px,4vw,48px);font-family:var(--f-doc);font-size:17px;line-height:1.65}
textarea#doc-input:focus{outline:none}
#doc-read{padding:28px clamp(18px,4vw,48px) 40px;font-family:var(--f-doc);font-size:17px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;max-height:78vh;overflow:auto}
.docbox.drag::after{content:"Upuść plik umowy (.txt, .pdf, .docx)";position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--sheet) 85%,transparent);color:var(--accent);font-weight:600}
mark.r{background:var(--bg-sev);color:inherit;border-bottom:2px solid var(--c-sev);padding:1px 0;cursor:pointer;border-radius:2px;transition:box-shadow .15s}
mark.r .n{font-family:var(--f-mono);font-size:10.5px;font-weight:500;vertical-align:super;line-height:0;color:var(--c-sev);margin-left:2px}
mark.r.on{box-shadow:0 0 0 2px var(--c-sev)}
mark.r.dim{background:transparent;border-bottom-color:var(--rule)}
mark.r.dim .n{color:var(--ink-3)}
.sev-krytyczne{--c-sev:var(--crit);--bg-sev:var(--crit-bg)}
.sev-wysokie{--c-sev:var(--high);--bg-sev:var(--high-bg)}
.sev-srednie{--c-sev:var(--med);--bg-sev:var(--med-bg)}
.sev-niskie{--c-sev:var(--low);--bg-sev:var(--low-bg)}
.docfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.busy{position:absolute;inset:0;background:color-mix(in srgb,var(--sheet) 82%,transparent);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:2;border-radius:0 0 6px 6px}
.busy-card{text-align:center;display:grid;gap:12px;justify-items:center;padding:20px}
.busy-card strong{font-family:var(--f-doc);font-size:22px;font-weight:500}
.busy-card span{color:var(--ink-2);font-size:14px;font-variant-numeric:tabular-nums}
.scan{width:200px;height:3px;background:var(--rule);border-radius:3px;overflow:hidden}
.scan i{display:block;width:40%;height:100%;background:var(--accent);animation:scan 1.4s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.scan i{animation:none;width:100%}}

/* Panel opinii */
.panel{display:grid;gap:16px;min-width:0}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);min-width:0}
.verdict{padding:18px 20px;display:grid;gap:12px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.demo-tag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:3px;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.verdict h2{margin:0;font-family:var(--f-doc);font-weight:500;font-size:22px;line-height:1.25;text-wrap:balance}
.verdict .summary{margin:0;color:var(--ink-2);font-size:14.5px}
.meter{display:grid;gap:6px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meter-row b{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.meter-row small{color:var(--ink-3)}
.bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--low) 0 25%,var(--med) 25% 50%,var(--high) 50% 75%,var(--crit) 75% 100%);position:relative;opacity:.9}
.bar i{position:absolute;top:-4px;width:3px;height:16px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg-sev);color:var(--c-sev)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-sev)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.meta span b{color:var(--ink);font-weight:600}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.count{border:1px solid var(--rule);border-radius:5px;padding:8px 8px 6px;cursor:pointer;background:transparent;text-align:left;display:grid;gap:1px;border-top:3px solid var(--c-sev)}
.count b{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.count small{font-size:11.5px;color:var(--ink-2)}
.count[aria-pressed="false"]{opacity:.4;border-top-color:var(--rule)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.risks{display:grid}
.risks-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule)}
.risks-head h3{margin:0;font-size:15px;font-weight:600}
.risks-head small{color:var(--ink-3)}
.risk{border-bottom:1px solid var(--rule);border-left:4px solid var(--c-sev);padding:14px 18px 14px 16px;display:grid;gap:8px;scroll-margin:12px}
.risk:last-child{border-bottom:0}
.risk.on{background:color-mix(in srgb,var(--bg-sev) 45%,var(--sheet))}
.risk-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.risk-top h4{margin:0;font-size:15px;font-weight:600;line-height:1.35;display:flex;gap:8px}
.risk-top h4 .n{font-family:var(--f-mono);font-size:12px;color:var(--c-sev);padding-top:2px;flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.tags span{border:1px solid var(--rule);border-radius:3px;padding:0 6px}
blockquote.q{margin:0;padding:6px 10px;border-left:2px solid var(--rule);font-family:var(--f-doc);font-style:italic;color:var(--ink-2);font-size:15px;cursor:pointer}
blockquote.q.missing{cursor:default}
.risk p{margin:0;font-size:14px}
.risk dl{margin:0;display:grid;gap:8px}
.risk dt{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.risk dd{margin:2px 0 0;font-size:14px}
.risk dd.basis{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.wording{background:var(--accent-soft);border-radius:4px;padding:8px 10px;font-family:var(--f-doc);font-size:15px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.wording button{flex:none;font-size:12px;padding:3px 8px}
details.more summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
.missing-list{padding:12px 18px 16px;display:grid;gap:10px}
.missing-list div b{display:block;font-size:14px}
.missing-list div span{font-size:13.5px;color:var(--ink-2)}
.empty{padding:28px 20px;display:grid;gap:10px;color:var(--ink-2)}
.empty h2{margin:0;font-family:var(--f-doc);font-weight:500;font-size:22px;color:var(--ink)}
.empty ol{margin:0;padding-left:20px;display:grid;gap:4px}
.msg{padding:10px 14px;font-size:13.5px;border-radius:5px;background:var(--crit-bg);color:var(--crit)}
.msg.info{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:5px;font-size:13.5px;z-index:20;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true">§</div>
      <div><h1>Prawnik AI</h1><p>Przegląd umów i mapa ryzyk prawnych</p></div>
    </div>
    <p class="disclaimer">Narzędzie wspiera analizę, ale nie zastępuje porady radcy prawnego ani adwokata. Treść umowy jest wysyłana do Claude na Twoim koncie.</p>
  </header>

  <div class="grid">
    <section class="sheet" aria-label="Umowa">
      <div class="toolbar">
        <button class="btn" id="btn-file" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 1.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5.5z"/><path d="M9 1.5v4h4"/></svg>Wczytaj plik</button>
        <input type="file" id="file" class="sr" accept=".txt,.md,.pdf,.docx,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        <button class="btn" id="btn-sample" type="button">Przykładowa umowa</button>
        <button class="btn" id="btn-edit" type="button" hidden>Edytuj tekst</button>
        <button class="btn" id="btn-clear" type="button">Wyczyść</button>
        <span class="spacer"></span>
        <button class="btn primary" id="btn-analyze" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>Analizuj ryzyka</button>
      </div>
      <div class="opts">
        <label class="grow" for="perspective">Reprezentuję stronę
          <input class="ctl" id="perspective" type="text" placeholder="np. Wykonawca, Najemca — puste = ocena neutralna">
        </label>
        <label for="depth">Dokładność
          <select class="ctl" id="depth">
            <option value="quick">Szybka</option>
            <option value="default" selected>Standardowa</option>
            <option value="complex">Dogłębna (wolniej)</option>
          </select>
        </label>
      </div>
      <div class="docbox" id="docbox">
        <textarea id="doc-input" spellcheck="false" placeholder="Wklej tutaj treść umowy albo przeciągnij plik .txt, .pdf lub .docx…"></textarea>
        <div id="doc-read" hidden></div>
        <div class="busy" id="busy" hidden>
          <div class="busy-card">
            <strong>Analizuję umowę…</strong>
            <div class="scan"><i></i></div>
            <span id="busy-status">Czytam postanowienia</span>
            <button class="btn" id="btn-stop" type="button">Zatrzymaj</button>
          </div>
        </div>
      </div>
      <div class="docfoot"><span id="stat-chars">0 znaków</span><span id="stat-hint">Kliknij zakreślony fragment, aby zobaczyć opis ryzyka</span></div>
    </section>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const SAMPLE = `UMOWA O ŚWIADCZENIE USŁUG PROGRAMISTYCZNYCH nr 14/2026

zawarta w Poznaniu w dniu 2 listopada 2026 r. pomiędzy:

§ 1. Przedmiot umowy
1. Wykonawca zobowiązuje się do wykonania oprogramowania według wymagań przekazywanych przez Zamawiającego w trakcie trwania umowy.
2. Wykonawca oświadcza, że posiada kwalifikacje niezbędne do wykonania umowy.

§ 2. Termin wykonania

§ 4. Kary umowne
1. Za każdy dzień opóźnienia Wykonawca zapłaci karę umowną w wysokości 2% wynagrodzenia ryczałtowego.

1. Odpowiedzialność Zamawiającego z tytułu niewykonania lub nienależytego wykonania umowy jest wyłączona.

§ 6. Prawa autorskie
1. Z chwilą wydania utworu Wykonawca przenosi na Zamawiającego autorskie prawa majątkowe do oprogramowania na wszystkich znanych polach eksploatacji.

§ 7. Zakaz konkurencji
1. Przez okres 3 lat od zakończenia umowy Wykonawca nie będzie świadczył usług na rzecz jakiegokolwiek podmiotu działającego w branży IT.

§ 9. Rozwiązanie umowy

/* ---------- pomocnicze ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
function normSev(s){s=String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(s.startsWith("kryt")||s.startsWith("crit"))return"krytyczne";if(s.startsWith("wys")||s.startsWith("high"))return"wysokie";
  if(s.startsWith("sred")||s.startsWith("med"))return"srednie";return"niskie"}
function updateStats(){const n=state.text.length;els.stats.textContent=n.toLocaleString("pl-PL")+" znaków"+(n>MAX_CHARS?" — za długa (limit "+MAX_CHARS.toLocaleString("pl-PL")+")":"")}

/* ---------- lokalizacja cytatów w tekście ---------- */
function locate(text,risks){
  const ranges=[];
  risks.forEach((r,i)=>{
    r.found=false;const q=(r.quote||"").trim();if(q.length<4)return;
    let start=text.indexOf(q),end=start+q.length;
    if(start<0){
      const pat=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/["„”“«»]/g,'["„”“«»]').replace(/['’‘]/g,"['’‘]").replace(/\s+/g,"\\s+").replace(/[-–—]/g,"[-–—]");
      try{const m=new RegExp(pat,"i").exec(text);if(m){start=m.index;end=start+m[0].length}}catch{}
    }
    if(start<0){ // ostatnia próba: pierwsze ~8 słów
      const head=q.split(/\s+/).slice(0,8).join(" ");
      if(head.length>12){const s=text.indexOf(head);if(s>=0){start=s;end=s+head.length}}
    }
    if(start>=0)ranges.push({i,start,end});
  });
  ranges.sort((a,b)=>a.start-b.start||b.end-a.end);
  const out=[];let last=-1;
  for(const g of ranges){if(g.start>=last){out.push(g);last=g.end;risks[g.i].found=true}}
  return out;
}

/* ---------- render dokumentu ---------- */
function renderDoc(){
  const a=state.analysis;
  const reading=!!a;
  els.input.hidden=reading;els.read.hidden=!reading;els.edit.hidden=!reading;
  els.hint.hidden=!reading;
  if(!reading){if(els.input.value!==state.text)els.input.value=state.text;return}
  const ranges=locate(state.text,a.risks);
  let html="",pos=0;
  for(const g of ranges){
    const r=a.risks[g.i];
    html+=esc(state.text.slice(pos,g.start));
    const dim=!state.filter.has(r.sev)?" dim":"";const on=state.active===g.i?" on":"";
    html+=`<mark class="r sev-${r.sev}${dim}${on}" data-i="${g.i}" tabindex="0" title="${esc(r.title)}">${esc(state.text.slice(g.start,g.end))}<span class="n">${g.i+1}</span></mark>`;
    pos=g.end;
  }
  html+=esc(state.text.slice(pos));
  els.read.innerHTML=html;
}

      ${r.quote?`<blockquote class="q${r.found?"":" missing"}" data-goto="${i}">„${esc(r.quote)}”</blockquote>`:""}

/* ---------- normalizacja wyniku AI ---------- */
function normalize(raw){
  if(!raw||typeof raw!=="object"||!Array.isArray(raw.risks))throw{code:"invalid_json"};
  const risks=raw.risks.filter(r=>r&&typeof r==="object").map(r=>({
    quote:String(r.quote||"").replace(/^[„"“]+|[”"]+$/g,"").trim(),title:String(r.title||"Ryzyko"),sev:normSev(r.severity),
    category:r.category?String(r.category):"",affects:r.affects?String(r.affects):"",explanation:String(r.explanation||""),
    legalBasis:r.legalBasis?String(r.legalBasis):"",recommendation:r.recommendation?String(r.recommendation):"",suggestedWording:r.suggestedWording?String(r.suggestedWording):""
  }));
  // kolejność wg położenia w tekście
  risks.forEach(r=>{const p=state.text.indexOf(r.quote);r._pos=p<0?1e9:p});
  risks.sort((a,b)=>a._pos-b._pos);
  return {contractType:String(raw.contractType||""),parties:Array.isArray(raw.parties)?raw.parties.map(String):[],governingLaw:raw.governingLaw?String(raw.governingLaw):"",
    overallRisk:raw.overallRisk,riskScore:raw.riskScore,summary:String(raw.summary||""),risks,
    missingClauses:Array.isArray(raw.missingClauses)?raw.missingClauses.filter(Boolean).map(m=>({title:String(m.title||m),why:String(m.why||"")})):[]};
}

/* ---------- prompt ---------- */
function buildPrompt(text,persp){
  return `Jesteś doświadczonym radcą prawnym specjalizującym się w prawie umów (prawo cywilne, gospodarcze, prawo pracy, IP, RODO). Przeprowadź przegląd poniższej umowy i wskaż WSZYSTKIE postanowienia niosące ryzyko prawne lub biznesowe.

Perspektywa: ${persp?`reprezentujesz stronę: ${persp}. Oceniaj ryzyka przede wszystkim z jej punktu widzenia, ale wskaż też zapisy, które mogą być nieważne lub nieskuteczne.`:"neutralna — oceniaj ryzyka dla obu stron i wskaż, której strony dotyczą."}

Szukaj m.in.: nieokreślonego przedmiotu lub terminu, jednostronnych uprawnień, kar umownych (wysokość, brak limitu, opóźnienie vs zwłoka), wyłączeń i limitów odpowiedzialności, terminów płatności, praw autorskich i pól eksploatacji, zakazu konkurencji, poufności, rozwiązania umowy, automatycznego przedłużenia, cesji, właściwości sądu, danych osobowych, klauzul abuzywnych (jeśli stroną jest konsument), niezgodności z przepisami bezwzględnie obowiązującymi, niespójności wewnętrznych i niejasnych definicji.

Zasady:
- "quote" to fragment skopiowany z umowy DOSŁOWNIE, znak w znak (te same słowa, interpunkcja i wielkość liter), 4–40 słów, bez wielokropków i bez numeru paragrafu. Musi dać się odnaleźć w tekście wyszukiwaniem.
- Jedno ryzyko = jeden cytat. Cytaty nie mogą na siebie nachodzić.
- "severity": jedno z: "krytyczne", "wysokie", "średnie", "niskie".
- Odpowiadaj po polsku. Jeśli umowa jest w innym języku, cytaty zostaw w oryginale, resztę napisz po polsku.
- "legalBasis": konkretne przepisy (np. "art. 484 § 2 KC"), jeśli umowa podlega prawu polskiemu; w innym przypadku wskaż właściwe prawo lub zostaw pusty tekst. Nie wymyślaj przepisów.
- "suggestedWording": gotowe, bezpieczniejsze brzmienie postanowienia.
- "missingClauses": ważne postanowienia, których brakuje.
- "riskScore": 0–100, gdzie 100 to umowa skrajnie ryzykowna.

Zwróć WYŁĄCZNIE JSON o strukturze:
{"contractType":"…","parties":["…"],"governingLaw":"…","overallRisk":"krytyczne|wysokie|średnie|niskie","riskScore":0,"summary":"2–4 zdania","risks":[{"quote":"…","title":"…","severity":"…","category":"…","affects":"…","explanation":"…","legalBasis":"…","recommendation":"…","suggestedWording":"…"}],"missingClauses":[{"title":"…","why":"…"}]}

UMOWA:
<<<
${text}
>>>`;
}

const ERR = {
  not_granted:"Nie zezwolono tej stronie na użycie Claude. Analiza AI jest niedostępna w tym widoku.",
  sampling_disabled:"Claude jest niedostępny dla tego konta lub organizacji.",
  rate_limited:"Osiągnięto limit zapytań. Spróbuj ponownie za chwilę.",
  session_expired:"Sesja wygasła — zaloguj się ponownie i spróbuj jeszcze raz.",
  prompt_too_large:"Umowa jest zbyt długa do jednej analizy. Podziel ją na części.",
  refused:"Claude odmówił analizy tego tekstu. Sprawdź, czy wklejono właściwy dokument.",
  invalid_json:"Odpowiedź AI miała nieprawidłowy format. Kliknij „Analizuj ryzyka” ponownie.",
  empty_completion:"AI nie zwróciło odpowiedzi. Spróbuj z krótszym fragmentem umowy.",
  upstream_error:"Chwilowy problem z połączeniem. Spróbuj ponownie."
};

/* ---------- analiza ---------- */
async function analyze(){
  state.text=els.input.hidden?state.text:els.input.value;
  state.error=null;
  if(state.text.trim().length<80){state.error="Wklej pełną treść umowy (co najmniej kilka zdań).";render();return}
  if(state.text.length>MAX_CHARS){state.error="Umowa przekracza limit "+MAX_CHARS.toLocaleString("pl-PL")+" znaków. Podziel ją na części.";render();return}
  if(!state.sample){state.error="Analiza AI jest dostępna po otwarciu strony w Claude (claude.ai lub aplikacja).";render();return}
  state.ctl=new AbortController();
  els.busy.hidden=false;els.analyze.disabled=true;els.status.textContent="Czytam postanowienia";
  try{
    const raw=await state.sample.json(buildPrompt(state.text,els.persp.value.trim()),{
      modelTier:els.depth.value,signal:state.ctl.signal,
      onText:({text})=>{const n=(text.match(/"severity"/g)||[]).length;els.status.textContent=n?`Znalezione ryzyka: ${n}`:"Porządkuję wnioski"}
    });
    state.analysis=normalize(raw);state.demo=false;state.active=null;state.filter=new Set(SEV_KEYS);
    store.set("analysis",{a:state.analysis,text:state.text});
  }catch(e){
    if(e?.code!=="cancelled")state.error=ERR[e?.code]||ERR.upstream_error;
  }finally{
    els.busy.hidden=true;els.analyze.disabled=false;state.ctl=null;render();
  }
}

/* ---------- raport ---------- */
function report(){
  const a=state.analysis;if(!a)return"";
  let s=`# Prawnik AI — raport ryzyk\n\n**Umowa:** ${a.contractType}\n**Strony:** ${a.parties.join("; ")}\n**Ryzyko ogólne:** ${SEV[normSev(a.overallRisk)].label} (${a.riskScore}/100)\n\n${a.summary}\n\n## Ryzyka\n`;
  a.risks.forEach((r,i)=>{s+=`\n### ${i+1}. ${r.title} — ${SEV[r.sev].label}\n> ${r.quote}\n\n${r.explanation}\n\n- **Kategoria:** ${r.category}\n- **Dotyczy:** ${r.affects}\n- **Podstawa prawna:** ${r.legalBasis}\n- **Rekomendacja:** ${r.recommendation}\n${r.suggestedWording?`- **Proponowane brzmienie:** ${r.suggestedWording}\n`:""}`});
  if(a.missingClauses.length){s+=`\n## Brakujące postanowienia\n`;a.missingClauses.forEach(m=>s+=`- **${m.title}** — ${m.why}\n`)}
  s+=`\n---\n_Raport wygenerowany przez AI. Nie stanowi porady prawnej._\n`;return s;
}
async function copy(t,label){try{await navigator.clipboard.writeText(t);toast(label||"Skopiowano")}catch{toast("Nie udało się skopiować — zaznacz tekst ręcznie")}}

/* ---------- interakcje ---------- */
function focusRisk(i,from){
  state.active=i;
  const r=state.analysis.risks[i];if(r&&!state.filter.has(r.sev))state.filter.add(r.sev);
  render();
  if(from!=="panel"){const c=$("risk-"+i);c&&c.scrollIntoView({behavior:"smooth",block:"nearest"})}
  if(from!=="doc"){const m=els.read.querySelector(`mark[data-i="${i}"]`);m&&m.scrollIntoView({behavior:"smooth",block:"center"})}
}
els.read.addEventListener("click",e=>{const m=e.target.closest("mark.r");if(m)focusRisk(+m.dataset.i,"doc")});
els.read.addEventListener("keydown",e=>{if(e.key==="Enter"){const m=e.target.closest("mark.r");if(m)focusRisk(+m.dataset.i,"doc")}});
els.panel.addEventListener("click",e=>{
  const f=e.target.closest("[data-filter]");
  if(f){const k=f.dataset.filter;state.filter.has(k)?state.filter.delete(k):state.filter.add(k);if(!state.filter.size)state.filter=new Set(SEV_KEYS);render();return}
  const c=e.target.closest("[data-copy]");if(c){copy(state.analysis.risks[+c.dataset.copy].suggestedWording,"Skopiowano proponowane brzmienie");return}
  if(e.target.closest("#btn-copy")){copy(report(),"Raport skopiowany");return}
  if(e.target.closest("#btn-dl")){state.downloads.save({filename:"prawnik-ai-raport.md",data:report()}).then(()=>toast("Zapisano raport")).catch(()=>{});return}
  const q=e.target.closest("blockquote.q[data-goto]");if(q&&!q.classList.contains("missing")){focusRisk(+q.dataset.goto,"panel");return}
  const card=e.target.closest(".risk");if(card&&!e.target.closest("details,button")){focusRisk(+card.dataset.i,"panel")}
});
els.input.addEventListener("input",()=>{state.text=els.input.value;updateStats();clearTimeout(els.input.t);els.input.t=setTimeout(()=>store.set("draft",state.text),400)});
els.analyze.onclick=analyze;
$("btn-stop").onclick=()=>state.ctl?.abort();
els.edit.onclick=()=>{state.analysis=null;state.demo=false;state.active=null;render();els.input.focus()};
$("btn-clear").onclick=()=>{state.text="";state.analysis=null;state.demo=false;state.error=null;store.set("draft","");store.set("analysis",null);render();els.input.focus()};
$("btn-sample").onclick=()=>{state.text=SAMPLE;state.analysis=normalize(DEMO);state.demo=true;state.active=null;state.error=null;state.filter=new Set(SEV_KEYS);render()};
$("btn-file").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(f)loadFile(f);e.target.value=""};

/* ---------- wczytywanie plików ---------- */
const loaded={};
function loadScript(src){return loaded[src]||(loaded[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete loaded[src];rej(new Error("load"))};document.head.appendChild(s)}))}
async function loadFile(f){
  state.error=null;const name=f.name.toLowerCase();
  try{
    let text="";
    if(name.endsWith(".pdf")){
      toast("Odczytuję PDF…");
      const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
      await loadScript(base+"pdf.worker.min.js");await loadScript(base+"pdf.min.js");
      pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
      const pages=[];
      for(let p=1;p<=pdf.numPages;p++){const c=await (await pdf.getPage(p)).getTextContent();
        let line="",out=[];for(const it of c.items){line+=it.str;if(it.hasEOL){out.push(line);line=""}}if(line)out.push(line);pages.push(out.join("\n"))}
      text=pages.join("\n\n");
      if(text.replace(/\s/g,"").length<50)throw new Error("scan");
    }else if(name.endsWith(".docx")){
      toast("Odczytuję plik Word…");
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
      text=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;
    }else if(name.endsWith(".doc")){throw new Error("doc")}
    else text=await f.text();
    state.text=text.replace(/\r\n?/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
    state.analysis=null;state.demo=false;store.set("draft",state.text);toast("Wczytano: "+f.name);
  }catch(err){
    state.error=err.message==="scan"?"Ten PDF wygląda na skan bez warstwy tekstowej. Wklej tekst ręcznie lub użyj pliku z OCR."
      :err.message==="doc"?"Stary format .doc nie jest obsługiwany. Zapisz plik jako .docx lub .pdf."
      :"Nie udało się odczytać pliku. Spróbuj formatu .txt, .pdf lub .docx albo wklej tekst.";
  }
  render();
}
const box=$("docbox");
["dragenter","dragover"].forEach(t=>box.addEventListener(t,e=>{e.preventDefault();box.classList.add("drag")}));
["dragleave","drop"].forEach(t=>box.addEventListener(t,e=>{e.preventDefault();if(t==="dragleave"&&box.contains(e.relatedTarget))return;box.classList.remove("drag")}));
box.addEventListener("drop",e=>{const f=e.dataTransfer?.files?.[0];if(f)loadFile(f)});

/* ---------- start ---------- */
(function init(){
  const saved=store.get("analysis"),draft=store.get("draft");
  if(saved&&saved.a&&saved.text){state.text=saved.text;state.analysis=saved.a}
  else if(draft){state.text=draft}
  else{state.text=SAMPLE;state.analysis=normalize(DEMO);state.demo=true}
  render();
  if(window.claude?.use){
    claude.use("sample").then(s=>{state.sample=s}).catch(()=>{});
    claude.use("downloads").then(d=>{state.downloads=d;if(d&&state.analysis)renderPanel()}).catch(()=>{});
  }
})();
</script>
